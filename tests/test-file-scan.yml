name: Test file scan mode with requirements.txt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a requirements file to scan
        run: |
          cat > "$GITHUB_WORKSPACE/requirements-test.txt" <<'EOF'
          requests==2.31.0
          EOF

      - id: action
        uses: .
        with:
          scan: file
          requirements: requirements-test.txt
          continue-on-error: "true"
          output-format: json
        continue-on-error: true

      - name: Assert action ran and produced output
        env:
          CLI_OUTPUT: ${{ steps.action.outputs.cli-output }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "cli-output length: ${#CLI_OUTPUT}"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
            if [ -z "$EXIT_CODE" ]; then
              echo "NOTE: exit-code output is empty (may be normal for this action version)"
            else
              echo "exit-code value: $EXIT_CODE"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
